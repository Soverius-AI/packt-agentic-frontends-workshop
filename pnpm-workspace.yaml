packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@scarf/scarf": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true

minimumReleaseAgeExclude:
  - "@copilotkit/runtime@1.69.2"
  - "@copilotkit/shared@1.69.2"
  - "@copilotkit/a2ui-renderer@1.69.2"
  - "@copilotkit/core@1.69.2"
  - "@copilotkit/react-core@1.69.2"
  - "@copilotkit/runtime-client-gql@1.69.2"
  - "@copilotkit/web-components@1.69.2"
  - "@copilotkit/web-inspector@1.69.2"
  - "@mastra/core@1.62.0"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - lmdb
  - msgpackr-extract
